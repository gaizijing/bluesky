version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_CESIUM_BASE_URL=/cesium
      - VITE_CESIUM_TOKEN=${VITE_CESIUM_TOKEN}
      - VITE_QWEATHER_API_KEY=${VITE_QWEATHER_API_KEY}
    command: npm run dev