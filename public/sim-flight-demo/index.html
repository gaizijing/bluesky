<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>联机飞行 Demo · Sim Flight</title>
  <link rel="stylesheet" href="https://unpkg.com/cesium@1.122.0/Build/Cesium/Widgets/widgets.css" />
  <script src="https://unpkg.com/cesium@1.122.0/Build/Cesium/Cesium.js"></script>
  <style>
    html, body, #map { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #040c14; }
    .cesium-viewer-bottom { display: none; }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(6, 18, 32, 0.72);
      color: #e8f4ff;
      font: 500 13px/1.5 "Segoe UI", sans-serif;
      min-width: 220px;
    }
    .hud h1 { margin: 0 0 8px; font-size: 15px; }
    .controls {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(6, 18, 32, 0.72);
      color: #e8f4ff;
    }
    .controls select, .controls button {
      font-size: 13px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: inherit;
    }
    .controls button { cursor: pointer; }
  </style>
</head>
<body>
  <div id="map"></div>
  <aside class="hud" aria-label="联飞 HUD">
    <h1>Sim Flight Demo</h1>
    <div>连接：<span id="hudStatus">—</span></div>
    <div>速度：<span id="hudSpeed">—</span></div>
    <div>高度：<span id="hudAlt">—</span></div>
  </aside>
  <aside class="controls" aria-label="联飞控制">
    <label>
      Region
      <select id="regionSelect"></select>
    </label>
    <label>
      航路
      <select id="routeSelect"></select>
    </label>
    <div>
      <button type="button" id="btnMockStart">Mock 起飞</button>
      <button type="button" id="btnMockStop">停止</button>
    </div>
  </aside>
  <script src="./env.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
